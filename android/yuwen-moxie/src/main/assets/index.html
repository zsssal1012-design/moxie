<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff8a1f">
<title>语文默写</title>
<style>
/* ================= 橙黄 · iOS 玻璃拟态（横屏专用） ================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --o1:#ffd86b; --o2:#ff8a1f; --o3:#f2610b;
  --ink:#4a2f18; --ink2:#9b7758;
  --glass:rgba(255,255,255,.6);
  --line:rgba(255,255,255,.78);
  --sh:0 14px 34px rgba(180,96,28,.14), inset 0 1px 0 rgba(255,255,255,.95);
}
html,body{height:100%;overflow:hidden}
body{font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fff6ec;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:-1;background:
  radial-gradient(115% 95% at 6% 0%,#ffe9cf 0,rgba(255,246,236,0) 62%),
  radial-gradient(95% 85% at 100% 8%,#ffddb5 0,rgba(255,246,236,0) 58%),
  linear-gradient(135deg,#fff6ec,#fff2df)}
#bg i{position:absolute;border-radius:50%;filter:blur(58px);opacity:.55;animation:fl 18s ease-in-out infinite}
#bg .a{width:300px;height:300px;left:-70px;top:38%;background:#ff9d4d}
#bg .b{width:260px;height:260px;right:-60px;top:10%;background:#ffcc72;animation-delay:-6s}
#bg .c{width:340px;height:340px;left:38%;bottom:-150px;background:#ffb377;animation-delay:-11s}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-24px) scale(1.1)}}
.g{background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border:1px solid var(--line);box-shadow:var(--sh);border-radius:20px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink);outline:none;background:rgba(255,255,255,.88);border:1px solid rgba(170,125,90,.24);border-radius:13px;padding:8px 10px;font-size:14px}
textarea{border-radius:13px}
input:focus,textarea:focus{border-color:var(--o2)}
select{font-weight:600;font-size:13.5px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(200,140,80,.34);border-radius:8px}

/* ---------- 顶栏 ---------- */
#bar{height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(255,255,255,.52);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.72);position:relative;z-index:20}
#bar .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(150deg,var(--o1),var(--o3));display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;box-shadow:0 6px 14px rgba(242,97,11,.42)}
#bar h1{font-size:17px;letter-spacing:.6px}
#tabs{display:flex;gap:8px;margin-left:6px}
#tabs button{padding:8px 20px;border-radius:999px;font-size:14px;font-weight:700;color:var(--ink2);background:rgba(255,255,255,.55);border:1px solid var(--line)}
#tabs button.on{color:#fff;background:linear-gradient(150deg,#ffb347,var(--o3));box-shadow:0 8px 18px rgba(242,97,11,.34)}
.spacer{flex:1}
.btn{padding:9px 15px;border-radius:14px;font-size:14px;font-weight:600;background:rgba(255,255,255,.66);border:1px solid var(--line);box-shadow:0 6px 14px rgba(180,110,50,.1)}
.btn:active{transform:scale(.96)}
.btn.p{color:#fff;border:none;background:linear-gradient(150deg,#ffb347,var(--o3));box-shadow:0 10px 22px rgba(242,97,11,.36)}
.btn.s{padding:6px 11px;font-size:12.5px;border-radius:11px;background:rgba(255,255,255,.72)}
.btn.r{color:#c9503f}

/* ---------- 主体 ---------- */
#main{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;gap:12px;padding:12px}
#left{flex:1;min-width:0;display:flex;flex-direction:column}
#right{width:396px;flex:0 0 396px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
#preview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#pvBig{font-size:58px;font-weight:800;background:linear-gradient(150deg,var(--o2),var(--o3));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:8px}
#pvTip{font-size:14px;color:var(--ink2);line-height:2.1}
#pvDemo{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
#pvDemo div{padding:10px 16px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:13px;color:var(--ink2);text-align:left}
#pvDemo b{display:block;font-size:16px;color:var(--ink);margin-bottom:3px}

/* ---------- 右面板 ---------- */
#tools{padding:11px 12px;display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row label{font-size:12.5px;color:var(--ink2)}
#unitBox{flex:1;min-height:0;overflow-y:auto;padding:0 4px 4px}
.unit{border-radius:18px;margin-bottom:11px;background:linear-gradient(160deg,rgba(255,255,255,.72),rgba(255,248,238,.5));border:1px solid var(--line);box-shadow:0 10px 22px rgba(180,110,50,.11);overflow:hidden}
.unit.on{border-color:rgba(242,97,11,.5);box-shadow:0 12px 26px rgba(242,97,11,.2)}
.uhead{display:flex;align-items:center;gap:8px;padding:9px 11px;background:linear-gradient(150deg,rgba(255,214,107,.34),rgba(255,138,31,.16))}
.utag{font-size:15px;font-weight:800;color:var(--o3);padding:3px 11px;border-radius:10px;background:rgba(255,255,255,.85);border:1px dashed rgba(242,97,11,.45);cursor:pointer}
.ucnt{font-size:11.5px;color:var(--ink2);background:rgba(255,255,255,.72);padding:2px 7px;border-radius:9px}
.uplus{width:29px;height:29px;border-radius:11px;background:linear-gradient(150deg,#ffb347,var(--o3));color:#fff;font-size:20px;text-align:center;line-height:28px;font-weight:700;box-shadow:0 6px 14px rgba(242,97,11,.4)}
.ubody{padding:10px 11px}
.addrow{display:flex;gap:7px}
.addrow textarea{flex:1;min-width:0;height:54px;resize:vertical;line-height:1.6;font-size:13.5px;padding:9px 10px}
.terms{margin-top:9px;display:flex;flex-direction:column;gap:5px;max-height:200px;overflow-y:auto}
.term{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);font-size:14px}
.term .cb{width:18px;height:18px;border-radius:6px;border:1.6px solid rgba(160,120,85,.5);display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 auto}
.term.on .cb{background:linear-gradient(150deg,var(--o2),var(--o3));border-color:transparent}
.term .tw{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term .tw em{font-style:normal;color:var(--ink2);font-size:12px;margin-left:7px}
.term .x{color:#c9503f;font-size:15px;padding:0 5px}
.empty{padding:16px 8px;text-align:center;font-size:12.5px;color:var(--ink2);line-height:1.9}
#foot{padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink2)}
.seg{display:flex;gap:4px}
.seg button{padding:5px 8px;border-radius:10px;font-size:12.5px;background:rgba(255,255,255,.72);border:1px solid var(--line);color:var(--ink2)}
.seg button.on{background:linear-gradient(150deg,var(--o2),var(--o3));color:#fff;border-color:transparent}
#footN{font-size:12.5px;color:var(--ink2)}

/* ---------- 默写全屏 ---------- */
#run{position:fixed;inset:0;z-index:60;display:none}
#run.show{display:block}
#runTop{position:absolute;top:0;left:0;right:0;height:46px;display:flex;align-items:center;gap:11px;padding:0 14px;background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,0))}
#runTop .quit{font-size:13px;color:var(--ink2);padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.62);border:1px solid var(--line)}
#pgwrap{flex:1;height:7px;border-radius:8px;background:rgba(255,255,255,.72);overflow:hidden;border:1px solid var(--line)}
#pgbar{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--o1),var(--o3));transition:width .3s}
#pgnum{font-size:13.5px;font-weight:800;color:var(--o3);min-width:62px;text-align:right}
#tagtop{font-size:12px;color:var(--ink2);background:rgba(255,255,255,.62);padding:4px 9px;border-radius:10px;border:1px solid var(--line)}
#btnRe{font-size:15px;padding:4px 10px;border-radius:11px;background:rgba(255,255,255,.72);border:1px solid var(--line)}
.zone{position:absolute;top:46px;bottom:0;width:50%;z-index:2;display:grid;place-items:center}
#zL{left:0}#zR{right:0}
.zone .lab{font-size:13px;color:rgba(155,119,88,.34);letter-spacing:4px;transition:.2s}
.zone.act .lab{color:rgba(242,97,11,.62);transform:scale(1.1)}
#card{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(680px,86%);z-index:3;display:none}
#card .in{padding:42px 26px 30px;text-align:center;border-radius:26px;background:linear-gradient(165deg,rgba(255,255,255,.96),rgba(255,252,247,.9));border:1px solid #fff;box-shadow:0 24px 60px rgba(190,120,50,.22)}
#qMeta{font-size:12.5px;font-weight:400;color:var(--ink2);letter-spacing:2px;margin-bottom:18px}
#qText{font-size:46px;font-weight:800;letter-spacing:3px;line-height:1.45;word-break:break-all}
#ans{margin:18px auto 0;width:fit-content;max-width:100%;padding:0;font-size:0;max-height:0;overflow:hidden;transition:.32s;border-radius:16px;background:linear-gradient(150deg,rgba(255,214,107,.34),rgba(255,138,31,.18));border:1px dashed rgba(242,97,11,.0)}
#ans.show{padding:14px 22px;font-size:30px;font-weight:700;color:var(--o3);max-height:300px;overflow-y:auto;border-color:rgba(242,97,11,.35)}
#tapme{text-align:center;font-size:11.5px;color:rgba(155,119,88,.66);margin-top:11px;letter-spacing:2px}

/* ---------- 弹层 ---------- */
.mask{position:fixed;inset:0;z-index:80;background:rgba(74,47,24,.34);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:22px}
.mask.show{display:flex}
.dlg{width:min(780px,95%);max-height:88vh;display:flex;flex-direction:column;padding:18px 22px 20px;border-radius:26px;background:linear-gradient(170deg,rgba(255,255,255,.96),rgba(255,247,238,.94));border:1px solid #fff;box-shadow:0 30px 70px rgba(150,80,20,.3)}
.dlg h2{font-size:19px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dlg h2 span{font-size:12px;font-weight:400;color:var(--ink2)}
.dbody{flex:1;min-height:0;overflow-y:auto;margin:14px 0;padding-right:4px}
.dfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips b{font-size:17px;font-weight:700;padding:8px 15px;border-radius:14px;background:linear-gradient(150deg,rgba(255,214,107,.42),rgba(255,138,31,.2));border:1px solid rgba(242,97,11,.26)}
.chips i{font-style:normal;font-size:11px;color:var(--ink2);display:block;font-weight:400}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs .pr{display:flex;align-items:baseline;gap:9px;padding:9px 13px;border-radius:13px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-size:15px}
.pairs .pr i{font-style:normal;font-weight:800;color:var(--o3);font-size:18px}
.pairs .pr em{font-style:normal;color:var(--ink2);font-size:14px}
#hist{position:fixed;inset:0;z-index:70;display:none;flex-direction:column}
#hist.show{display:flex}
#hTop{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(255,255,255,.64);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
#hTop b{font-size:17px}
#hList{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.hitem{padding:12px 14px;border-radius:18px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--sh)}
.hh{display:flex;align-items:center;gap:10px;font-size:14px}
.k{font-size:11px;padding:2px 8px;border-radius:9px;background:linear-gradient(150deg,rgba(255,214,107,.5),rgba(255,138,31,.24));color:var(--o3);font-weight:800}
.k.n{background:rgba(160,130,110,.16);color:var(--ink2)}
.hbody{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed rgba(170,125,90,.24)}
.hitem.open .hbody{display:block}
#toast{position:fixed;left:50%;top:66px;transform:translate(-50%,-12px);z-index:95;padding:10px 18px;border-radius:16px;font-size:14px;color:#fff;background:rgba(60,40,26,.9);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:.25s;max-width:82vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#vp{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:120;font-size:12px;color:var(--o3);background:rgba(255,238,215,.92);padding:7px 14px;border-radius:14px;border:1px solid rgba(242,97,11,.3);display:none}
</style>
</head>
<body>
<div id="bg"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<header id="bar">
  <div class="logo">C</div><h1>语文默写</h1>
  <div id="tabs">
    <button class="on" data-m="word">✎ 字词默写</button>
    <button data-m="note">❦ 注释默写</button>
  </div>
  <div class="spacer"></div>
  <button class="btn s" id="btnNet">网络 检测中…</button>
  <button class="btn p" id="btnHist">📊 默写记录</button>
</header>

<div id="main">
  <section id="left" class="g">
    <div id="preview">
      <div id="pvBig">字词默写</div>
      <div id="pvTip"></div>
      <div id="pvDemo"></div>
      <button class="btn p" id="pvStart" style="padding:14px 40px;font-size:17px">▶ 开始默写</button>
    </div>
  </section>

  <aside id="right">
    <div id="tools" class="g">
      <div class="row">
        <label>年级</label><select id="selGrade"></select>
        <div class="spacer"></div>
        <button class="btn s" id="btnAdd">＋ 新建单元</button>
        <button class="btn s" id="btnSaveBank">💾 保存</button>
      </div>
      <div class="row">
        <label>已选 <b id="selCount" style="color:var(--o3)">0</b> 条 / 共 <b id="totCount">0</b> 条</label>
        <div class="spacer"></div>
        <button class="btn s" id="btnSelAll">全选</button>
        <button class="btn s" id="btnSelNone">清空选择</button>
        <button class="btn s" id="btnBak">备份</button>
      </div>
    </div>
    <div id="unitBox"></div>
    <div id="foot" class="g">
      <div class="set"><span>播报</span><div class="seg" id="segRep"></div></div>
      <div class="set" id="rateSet"><span>倍速</span><div class="seg" id="segRate"></div></div>
      <button class="btn s" id="btnVoice" title="点击切换发音通道">🔊 发音·自动</button>
      <div class="spacer"></div>
      <button class="btn p" id="btnStart">▶ 开始默写</button>
    </div>
  </aside>
</div>

<!-- 默写全屏 -->
<div id="run">
  <div id="runTop">
    <button class="quit" id="btnQuit">✕ 退出</button>
    <div id="pgwrap"><div id="pgbar"></div></div>
    <div id="tagtop"></div>
    <button id="btnRe" title="重听">🔊</button>
    <div id="pgnum">0 / 0</div>
  </div>
  <div class="zone" id="zL"><div class="lab">‹ 上一个</div></div>
  <div class="zone" id="zR"><div class="lab">下一个 ›</div></div>
  <div id="card">
    <div class="in">
      <div id="qMeta"></div>
      <div id="qText"></div>
      <div id="ans"></div>
    </div>
    <div id="tapme">点卡片看答案 · 左半屏上一个 · 右半屏下一个</div>
  </div>
</div>

<!-- 完成弹窗 -->
<div class="mask" id="mDone"><div class="dlg">
  <h2>✅ 默写完成 <span id="doneSub"></span></h2>
  <div class="dbody" id="doneBody"></div>
  <div class="dfoot">
    <button class="btn" id="doneAgain">再默一次</button>
    <button class="btn" id="doneHist">查看记录</button>
    <button class="btn p" id="doneOk">完成，返回题库</button>
  </div>
</div></div>

<!-- 记录 -->
<div id="hist">
  <div id="hTop"><b>📊 默写记录</b><div class="spacer"></div>
    <button class="btn s" id="hBak">导出备份</button>
    <button class="btn s r" id="hClear">清空记录</button>
    <button class="btn p" id="hClose">返回</button>
  </div>
  <div id="hList"></div>
</div>

<!-- 改名 -->
<div class="mask" id="mPrompt"><div class="dlg" style="width:min(430px,94%);max-height:none">
  <h2 id="ppTitle">重命名单元</h2>
  <div style="margin:16px 0"><input type="text" id="ppInput" style="width:100%;font-size:17px"></div>
  <div class="dfoot"><button class="btn" id="ppNo">取消</button><button class="btn p" id="ppYes">确定</button></div>
</div></div>

<!-- 备份 -->
<div class="mask" id="mBak"><div class="dlg">
  <h2>备份与恢复 <span>词库仅存本机，换机/卸载前请先导出</span></h2>
  <div class="dbody"><textarea id="bakText" style="width:100%;height:100%;min-height:230px;font-size:11px;line-height:1.5"></textarea></div>
  <div class="dfoot">
    <button class="btn" id="bakCopy">复制</button>
    <button class="btn" id="bakFile">导出到 Download</button>
    <button class="btn" id="bakFromFile">读取已导出文件</button>
    <button class="btn p" id="bakRestore">用上方内容恢复</button>
  </div>
</div></div>

<div id="toast"></div>
<div id="vp">竖屏不可用，请把平板横过来</div>

<script>
/* ==========================================================================
   语文默写（平板横屏版）
   word 字词默写：联网播报读音（多源级联，走 <audio> 直连，不受 CORS fetch 限制）
   note 注释默写：不发音；录入「前：后」，默写只显示冒号前，点卡片出答案
   两套题库按 年级 → 单元 → 词条 独立存放
   ========================================================================== */
var N = window.YwNative || null;
var LS = 'yw_moxie_v1';
var GRADES = ['七上','七下','八上','八下','九上','九下'];
function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }

/* ------------------------------ 数据 ------------------------------ */
function blank(){
  var d={ grade:'九上', mode:'word', rep:2, rate:1, voicePref:'auto', bank:{word:{},note:{}}, hist:[] };
  GRADES.forEach(function(g){ d.bank.word[g]=[]; d.bank.note[g]=[]; });
  return d;
}
function normalize(d){
  var b=blank(); if(!d||typeof d!=='object') return b;
  if(GRADES.indexOf(d.grade)>=0) b.grade=d.grade;
  b.mode = d.mode==='note' ? 'note' : 'word';
  b.rep  = Math.max(1,Math.min(5, +d.rep||2));
  b.rate = [0.7,0.8,1,1.2,1.4].indexOf(+d.rate)>=0 ? +d.rate : 1;
  b.voicePref = ['auto','native','online'].indexOf(d.voicePref)>=0 ? d.voicePref : 'auto';
  ['word','note'].forEach(function(m){
    var src=(d.bank||{})[m]||{};
    GRADES.forEach(function(g){
      var arr=Array.isArray(src[g])?src[g]:[];
      b.bank[m][g]=arr.map(function(u){
        var items=Array.isArray(u.items)?u.items.filter(function(it){return it&&typeof it.w==='string'&&it.w;})
          .map(function(it){ return { w:String(it.w).slice(0,80), h:String(it.h==null?'':it.h).slice(0,400), s:!!it.s }; }) : [];
        return { id:String(u.id||('u'+Math.random().toString(36).slice(2))), tag:String(u.tag||'K?').slice(0,20), items:items };
      });
    });
  });
  if(Array.isArray(d.hist)) b.hist=d.hist.slice(0,200).filter(function(h){ return h&&Array.isArray(h.items); });
  return b;
}
var S = blank();
function units(){ return S.bank[S.mode][S.grade]; }
function unitById(id){ var a=units(); for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }
function selectedTerms(){
  var out=[];
  units().forEach(function(u){ u.items.forEach(function(it){ if(it.s) out.push({w:it.w,h:it.h||'',u:u.tag}); }); });
  return out;
}
var saveTimer=null;
function save(now){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  clearTimeout(saveTimer);
  var j=JSON.stringify(S);
  var push=function(){ if(N&&N.save){ try{ N.save(j); }catch(e){} } };
  if(now) push(); else saveTimer=setTimeout(push,400);
}
function boot(){
  var raw='';
  if(N&&N.load){ try{ raw=N.load(); }catch(e){ raw=''; } }
  if(!raw){ try{ raw=localStorage.getItem(LS)||''; }catch(e){} }
  if(raw){ try{ S=normalize(JSON.parse(raw)); }catch(e){ S=blank(); } }
  save(true);
}

/* ------------------------------ 录入解析 ------------------------------ */
/* 字词：逗号（中英文）/ 顿号 / 分号 / 换行 分隔，纯词，自动去序号、去重 */
function parseWords(text){
  var arr=String(text||'').split(/[,，、;；\n\r]+/), out=[];
  for(var i=0;i<arr.length;i++){
    var w=arr[i].replace(/^[\s\u3000]*[\(（]?\d+[\.\)、）][\s\u3000]*/,'').replace(/[\s\u3000]+/g,'');
    // 字词板块只收纯词：若误写成「词：释义」，自动截取冒号前
    var k=w.search(/[：:]/); if(k>=0) w=w.slice(0,k);
    if(w && w.length<=80 && out.indexOf(w)<0) out.push(w);
  }
  return out;
}
/* 注释：条目 = 冒号前(题干) ： 冒号后(答案)。逗号/换行分多条，按第一个冒号切 */
function parseNotes(text){
  var arr=String(text||'').split(/[,，;；\n\r]+/), out=[];
  for(var i=0;i<arr.length;i++){
    var seg=String(arr[i]).trim(); if(!seg) continue;
    var k=seg.search(/[：:]/); if(k<0) continue;
    var a=seg.slice(0,k).replace(/[\s\u3000]+/g,'');
    var b=seg.slice(k+1).trim();
    if(!a||a.length>80) continue;
    var dup=false;
    for(var j=0;j<out.length;j++) if(out[j].w===a) dup=true;
    if(!dup) out.push({w:a,h:b.slice(0,400)});
  }
  return out;
}
function nextTag(){
  var i=1,t={}; units().forEach(function(u){ t[u.tag]=1; });
  while(t['K'+i]) i++;
  return 'K'+i;
}

function rootId(el){

  var n = el.closest ? el.closest('.unit') : null;

  return el?el.getAttribute('data-id'):null;
}

function addUnit(){
  var u={ id:'u'+Date.now().toString(36)+Math.floor(Math.random()*900+100), tag:nextTag(), items:[] };
  units().push(u); draft[u.id]=''; save(); renderUnits();
  var t=$('#unitBox .unit:last-child [data-in]'); if(t) t.focus();
  toast('已新建单元 '+u.tag+'，在框里输入内容');
}
function renameUnit(id){
  var u=unitById(id); if(!u) return;
  promptBox('重命名单元（当前：'+u.tag+'）', u.tag, function(v){
    v=v.replace(/\s+/g,'').slice(0,20); if(!v) return;
    u.tag=v; save(); renderUnits();
  });
}
function delUnit(id){
  var u=unitById(id); if(!u) return;
  confirmBox('删除单元「'+u.tag+'」及其 '+u.items.length+' 条内容？', function(){
    var g=S.bank[S.mode][S.grade];
    S.bank[S.mode][S.grade]=g.filter(function(x){ return x.id!==id; });
    save(true); renderUnits(); toast('已删除');
  });
}
function doAdd(id){
  var u=unitById(id); if(!u) return;
  var ta=$('#unitBox .unit[data-id="'+id+'"] [data-in]');
  var text=ta?ta.value:(draft[id]||'');
  var add=0, upd=0, bad=0;
  if(S.mode==='word'){
    parseWords(text).forEach(function(w){
      var ex=null; u.items.forEach(function(i){ if(i.w===w) ex=i; });
      if(ex){ ex.s=true; upd++; } else { u.items.push({w:w,h:'',s:true}); add++; }
    });
  }else{
    var raw=String(text||'').split(/[,，;；\n\r]+/).filter(function(x){ return x.trim(); }).length;
    parseNotes(text).forEach(function(o){
      var ex=null; u.items.forEach(function(i){ if(i.w===o.w) ex=i; });
      if(ex){ ex.h=o.h; ex.s=true; upd++; } else { u.items.push({w:o.w,h:o.h,s:true}); add++; }
    });
    var ok=parseNotes(text).length; bad=Math.max(0,raw-ok);
  }
  if(!add&&!upd) return toast(S.mode==='word'?'没有识别到词语':'没有识别到「前：后」格式的条目');
  draft[id]=''; if(ta) ta.value='';
  save(true); renderUnits();
  toast('保存成功：新增 '+add+(upd?'，更新 '+upd:'')+(bad?'，忽略无冒号 '+bad:''));
}
function fill(id,all){
  var u=unitById(id); if(!u) return;
  u.items.forEach(function(i){ i.s=all; });
  save(); renderUnits();
}

/* ------------------------------ 联网发音 ------------------------------ */
/* 用 <audio> 直连：媒体请求不受 fetch/CORS 限制，成功率远高于 fetch */
/* 在线兜底源顺序（实测 2026-09：有道对语文词条常返回 500，Google 全通但大陆可能不可达，
   故在线源只作兜底，首选仍是原生 TextToSpeech） */
var SRC=[
  function(t){ return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&total=1&idx=0&tl=zh-CN&q='+encodeURIComponent(t); },
  function(t){ return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=2'; },
  function(t){ return 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(t)+'&type=1'; },
  function(t){ return 'https://dict.youdao.com/dictvoice?le=zh&audio='+encodeURIComponent(t)+'&type=2'; }
];
var AC=new Audio(), best=0, voiceErr=0, gen=0;   // gen：播报代号，翻页即自增，用于掐掉上一词的残留播报
AC.preload='auto';
function stopVoice(){
  gen++;
  try{ AC.pause(); }catch(e){}
  try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
  if(N&&N.ttsStop){ try{ N.ttsStop(); }catch(e){} }   // 掐掉原生 TTS 排队中的朗读
}

/* 播一遍：从 k 号源开始尝试，失败自动换源；g 为本次播报代号 */
function playOnce(word, times, k, g){
  if(g!==gen) return;                              // 已翻页 → 丢弃
  if(k>=SRC.length){ localSay(word, times, g); return; }   // 在线源全灭 → 本机 TTS 兜底
  var url=SRC[k](word), settled=false;
  var timer=setTimeout(function(){ if(settled) return; settled=true; cleanup(); playOnce(word,times,k+1,g); }, 7000);
  function cleanup(){ clearTimeout(timer); AC.onended=null; AC.onerror=null; }
  AC.onended=function(){
    if(settled) return; settled=true; cleanup(); best=k;
    if(g!==gen) return;
    if(times>1) setTimeout(function(){ playOnce(word, times-1, k, g); }, 420);
  };
  AC.onerror=function(){
    if(settled) return; settled=true; cleanup(); playOnce(word,times,k+1,g);
  };
  try{ AC.src=url; AC.playbackRate=+S.rate||1; AC.volume=1; }catch(e){}
  var p=AC.play();
  if(p&&p.catch) p.catch(function(){ if(!settled){ settled=true; cleanup(); playOnce(word,times,k+1,g); } });
}
function localSay(word,times,g){
  if(g!==gen) return;
  try{
    var sy=window.speechSynthesis; if(!sy) return fail();
    sy.cancel();
    var n=Math.max(1,Math.min(5,times));
    for(var i=0;i<n;i++){
      var u=new SpeechSynthesisUtterance(word); u.lang='zh-CN'; u.rate=+S.rate||1;
      var v=(sy.getVoices()||[]).filter(function(x){return /^zh/i.test(x.lang);})[0];
      if(v) u.voice=v; sy.speak(u);
    }
  }catch(e){ fail(); }
  function fail(){
    if(!voiceErr){ voiceErr=1; toast('发音不可用：请检查网络',3200); }
  }
}
/* 发音通道：
   1) App 内且本机 TTS 可用 → 原生 TextToSpeech（离线、生僻词稳定）
   2) 否则 → 在线源级联（有道 / Google）
   3) 都失败 → 提示检查网络
   可用 #btnVoice 手动切换优先通道（voicePref: auto/native/online） */
function speak(word){
  if(S.mode!=='word') return;
  word=String(word||'').trim(); if(!word) return;
  stopVoice();                                     // 先掐掉上一个词（含排队中的重复播报）
  var g=gen, times=Math.max(1,Math.min(5,+S.rep||2));
  var pref=S.voicePref||'auto';
  if(pref!=='online' && N && N.ttsOk){
    try{
      if(N.ttsOk() && N.ttsSay && N.ttsSay(word, +S.rate||1, times)){
        nativeTries=0; return;                      // 本机在读，直接返回
      }
    }catch(e){}
  }
  playOnce(word, times, best, g);
}
var nativeTries=0;
/* 本机 TTS 不可用时，累计失败几次就永久改走在线 */
function voiceTag(){
  try{
    if(S.mode!=='word') return '';
    if(S.voicePref==='online') return '在线发音';
    if(N&&N.ttsOk&&N.ttsOk()) return '本机语音';
    return '在线发音';
  }catch(e){ return ''; }
}
/* 发音通道按钮：自动 → 在线 → 自动（App 内有本机语音时默认走本机） */
function syncVoiceBtn(){
  var b=$('#btnVoice'); if(!b) return;
  var t = S.voicePref==='online' ? '在线' : (S.voicePref==='native' ? '本机' : '自动');
  b.textContent='🔊 发音·'+t;
}
$('#btnVoice').onclick=function(){
  S.voicePref = S.voicePref==='online' ? 'auto' : 'online';
  save(); syncVoiceBtn();
  var w = R ? R.list[R.i].w : (units()[0]&&units()[0].items[0]&&units()[0].items[0].w);
  if(w){ speak(w); }
  toast(S.voicePref==='online' ? '已切为在线发音，试听：'+(w||'')
       : ((N&&N.ttsOk&&N.ttsOk())?'自动：优先本机语音，试听：'+(w||''):'自动：本机不可用，走在线，试听：'+(w||'')), 2600);
};
function netCheck(){
  var el=$('#btnNet');
  if(navigator.onLine===false){ el.textContent='网络 已断开 ✗'; el.style.color='#c9503f'; return; }
  var img=new Image(), hit=false;
  img.onload=img.onerror=function(){ if(hit)return; hit=true;
    el.textContent='网络 正常 ✓'; el.style.color=''; };
  setTimeout(function(){ if(hit)return; hit=true; el.textContent='网络 不稳定'; el.style.color='#b8791f'; },4500);
  img.src='https://dict.youdao.com/favicon.ico?_='+Date.now();
}
$('#btnNet').onclick=netCheck;

/* ------------------------------ 默写 ------------------------------ */
var R=null;
function startRun(){
  var sel=selectedTerms();
  if(!sel.length) return toast(S.mode==='word'?'先勾选要默写的词语（点词条行或“全选”）':'先勾选要默写的条目');
  R={ list:sel, i:0, mode:S.mode };

  $('#card').style.display = R.mode==='note' ? 'block' : 'none';
  $('#btnRe').style.display = R.mode==='note' ? 'none' : 'block';
  $('#zL').style.display=$('#zR').style.display='grid';
  draw();
  if(R.mode==='word') speak(R.list[0].w);
  buzz(14);
}
function draw(){
  var n=R.list.length, it=R.list[R.i];
  $('#pgbar').style.width=((R.i+1)/n*100)+'%';
  $('#pgnum').textContent=(R.i+1)+' / '+n;
  $('#tagtop').textContent=it.u+' · '+S.grade+(R.mode==='word'?(' · '+voiceTag()):'');
  if(R.mode==='note'){
    $('#qText').textContent=it.w;                       // 只显示冒号前
    $('#qMeta').textContent='默写第 '+(R.i+1)+' 条　·　写出对应的注释内容';
    var a=$('#ans'); a.textContent=it.h||'（这条没有填答案）'; a.classList.remove('show');
  }
}
function step(){
  draw();
  if(R.mode==='word') speak(R.list[R.i].w);
  buzz(10);
}
function next(){ if(!R) return; if(R.i>=R.list.length-1) return finish(); R.i++; step(); }
function prev(){ if(!R) return; if(R.i<=0) return toast('已经是第一条了',1200); R.i--; step(); }
function buzz(ms){ if(N&&N.buzz){ try{ N.buzz(ms||10); }catch(e){} } }

/* 生成一条默写记录（完成 / 中途退出 共用） */
function addRecord(list, mode){
  var tags={},tarr=[];
  list.forEach(function(x){ if(!tags[x.u]){ tags[x.u]=1; tarr.push(x.u); } });
  var rec={ id:'h'+Date.now()+Math.floor(Math.random()*99), ts:Date.now(), mode:mode,
    grade:S.grade, tags:tarr,
    items:list.map(function(x){ return { w:x.w, h:x.h||'', u:x.u }; }) };
  S.hist.unshift(rec);
  if(S.hist.length>200) S.hist.length=200;
  save(true);
  return rec;
}
function finish(){
  stopVoice();
  showDone(addRecord(R.list, R.mode));
}
function showDone(rec){
  $('#doneSub').textContent=(rec.mode==='word'?'字词':'注释')+' · '+rec.grade+' · '+rec.tags.join('/')+' · 共 '+rec.items.length+' 条　（已自动存入默写记录）';
  $('#doneBody').innerHTML = rec.mode==='word'
    ? '<div class="chips">'+rec.items.map(function(i){ return '<b>'+esc(i.w)+'<i>'+esc(i.u)+'</i></b>'; }).join('')+'</div>'
    : '<div class="pairs">'+rec.items.map(function(i){ return '<div class="pr"><i>'+esc(i.w)+'</i><em>'+esc(i.h||'—')+'</em></div>'; }).join('')+'</div>';
  $('#mDone').classList.add('show');
  window._lastRec=rec;
}
$('#doneOk').onclick=function(){ $('#mDone').classList.remove('show'); exitRun(); };
$('#doneHist').onclick=function(){ $('#mDone').classList.remove('show'); exitRun(); openHist(); };
$('#doneAgain').onclick=function(){
  $('#mDone').classList.remove('show');
  var l=R.list; R={ list:l, i:0, mode:R.mode };
  draw(); if(R.mode==='word') speak(l[0].w); toast('重新开始这一组',1400);
};
function exitRun(){
  stopVoice(); R=null;
  $('#run').classList.remove('show');
  $('#card').style.display='none';
  $('#main').style.visibility='visible';
  renderUnits();
}
$('#btnQuit').onclick=function(){
  if(!R) return exitRun();
  confirmBox('退出本次默写？（已默的 '+(R.i+1)+' 条会存入记录）', function(){
    if(R.i>=0) addRecord(R.list.slice(0,R.i+1), R.mode);
    exitRun();
    toast('已退出，本组已存入记录');
  });
};
$('#btnStart').onclick=$('#pvStart').onclick=startRun;

/* 左右半屏：触摸/鼠标；260ms 节流；滑动不翻页 */
var lastTap=0;
function tap(dir, el){
  if(!R||$('#mDone').classList.contains('show')) return;
  var now=Date.now(); if(now-lastTap<260) return; lastTap=now;
  if(el){ el.classList.add('act'); setTimeout(function(){ el.classList.remove('act'); },170); }
  dir>0?next():prev();
}
function bindZone(el,dir){
  var sx=0,sy=0;
  el.addEventListener('touchstart',function(e){ sx=e.changedTouches[0].clientX; sy=e.changedTouches[0].clientY; },{passive:true});
  el.addEventListener('touchend',function(e){
    var t=e.changedTouches[0];
    if(Math.abs(t.clientX-sx)>26||Math.abs(t.clientY-sy)>26) return;
    tap(dir,el);
  },{passive:true});
  el.addEventListener('mousedown',function(){ tap(dir,el); });
}
bindZone($('#zL'),-1); bindZone($('#zR'),1);
$('#card .in').addEventListener('click',function(e){
  e.stopPropagation(); $('#ans').classList.toggle('show'); buzz(8);
},false);

/* ------------------------------ 记录 ------------------------------ */
function fmt(ts){
  var d=new Date(ts), p=function(n){ return (n<10?'0':'')+n; };
  return (d.getMonth()+1)+'/'+d.getDate()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function openHist(){ renderHist(); $('#hist').classList.add('show'); }
function renderHist(){
  var box=$('#hList');
  if(!S.hist.length){ box.innerHTML='<div class="empty" style="font-size:14px;padding:70px 10px">还没有默写记录<br>完成一次默写后会自动保存在这里</div>'; return; }
  box.innerHTML=S.hist.map(function(h,i){
    var body=h.mode==='word'
      ? '<div class="chips">'+h.items.map(function(x){ return '<b>'+esc(x.w)+'<i>'+esc(x.u||'')+'</i></b>'; }).join('')+'</div>'
      : '<div class="pairs">'+h.items.map(function(x){ return '<div class="pr"><i>'+esc(x.w)+'</i><em>'+esc(x.h||'—')+'</em></div>'; }).join('')+'</div>';
    return '<div class="hitem" data-i="'+i+'"><div class="hh">'+
      '<span class="k'+(h.mode==='word'?'':' n')+'">'+(h.mode==='word'?'字词':'注释')+'</span>'+
      '<b style="font-size:15.5px">'+esc(h.grade)+'</b>'+
      '<span style="font-size:12.5px;color:var(--ink2)">'+esc((h.tags||[]).join(' / '))+'</span>'+
      '<span class="ucnt">'+h.items.length+' 条</span><div class="spacer"></div>'+
      '<span style="font-size:11.5px;color:var(--ink2)">'+fmt(h.ts)+'</span>'+
      '<button class="btn s" data-open="1">展开</button>'+
      '<button class="btn s r" data-del="1">删</button></div>'+
      '<div class="hbody">'+body+'</div></div>';
  }).join('');
  $$('#hList .hitem').forEach(function(el){
    el.querySelector('[data-open]').onclick=function(){
      el.classList.toggle('open');
      el.querySelector('[data-open]').textContent=el.classList.contains('open')?'收起':'展开';
    };
    el.querySelector('[data-del]').onclick=function(){
      confirmBox('删除这条记录？',function(){ S.hist.splice(+el.getAttribute('data-i'),1); save(true); renderHist(); });
    };
  });
}
$('#btnHist').onclick=openHist;
$('#hClose').onclick=function(){ $('#hist').classList.remove('show'); };
$('#hClear').onclick=function(){ confirmBox('清空全部默写记录？（词库不受影响）',function(){ S.hist=[]; save(true); renderHist(); toast('已清空'); }); };

/* ------------------------------ 备份 ------------------------------ */
function openBak(){ $('#bakText').value=JSON.stringify(S); $('#mBak').classList.add('show'); }
$('#btnBak').onclick=$('#hBak').onclick=openBak;
$('#bakCopy').onclick=function(){
  var t=$('#bakText'); t.focus(); t.select();
  var ok=false;
  try{ navigator.clipboard.writeText(t.value); ok=true; }catch(e){
    try{ ok=document.execCommand('copy'); }catch(e2){}
  }
  toast(ok?'已复制，可存到备忘录':'已全选：长按输入框 → 复制');
};
$('#bakFile').onclick=function(){
  var j=JSON.stringify(S), path='';
  if(N&&N.export){ try{ path=N.export(j); }catch(e){} }
  if(path) return toast('已导出：'+path,3600);
  try{
    var b=new Blob([j],{type:'application/json'}), a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='语文默写_备份.json'; document.body.appendChild(a); a.click();
    toast('已下载');
  }catch(e){ toast('导出失败，请用“复制”'); }
};
$('#bakFromFile').onclick=function(){
  if(!N||!N.readBackup) return toast('请在 App 内使用');
  var raw=''; try{ raw=N.readBackup(); }catch(e){}
  if(!raw) return toast('Download 里没有「语文默写_备份.json」',2800);
  $('#bakText').value=raw; toast('已读取，点“用上方内容恢复”生效',2600);
};
$('#bakRestore').onclick=function(){
  var d;
  try{ d=JSON.parse($('#bakText').value); }catch(e){ return toast('内容不是有效 JSON'); }
  if(!d||!d.bank) return toast('这不是本 App 的备份内容');
  confirmBox('用备份覆盖当前全部词库与记录？',function(){
    S=normalize(d); save(true); renderAll(); $('#mBak').classList.remove('show'); toast('恢复完成');
  });
};

/* ------------------------------ 弹层工具 ------------------------------ */
function toast(m,ms){
  var t=$('#toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, ms||1900);
}
var cb=null;
function promptBox(title,val,f){
  $('#ppTitle').textContent=title;
  var i=$('#ppInput'); i.value=val; cb=f;
  $('#mPrompt').classList.add('show');
  setTimeout(function(){ i.focus(); i.select(); },80);
}
$('#ppNo').onclick=function(){ $('#mPrompt').classList.remove('show'); cb=null; };
$('#ppYes').onclick=function(){ var v=$('#ppInput').value; $('#mPrompt').classList.remove('show'); var f=cb; cb=null; if(f)f(v); };
$('#ppInput').onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); $('#ppYes').click(); } };
/* 自绘确认框：WebView 中原生 confirm 不一定显示，统一用自己的 modal */
var mConfirm=null, cfCb=null;
function confirmBox(msg, f){
  if(!mConfirm){
    mConfirm=document.createElement('div');
    mConfirm.className='mask'; mConfirm.style.zIndex='99';
    mConfirm.innerHTML='<div class="dlg" style="width:min(480px,94%);max-height:none"><h2>请确认</h2>'+
      '<div id="cmsg" style="font-size:15px;line-height:1.9;color:var(--ink2);margin:14px 0 6px"></div>'+
      '<div class="dfoot"><button class="btn" id="cno">取消</button><button class="btn p" id="cyes">确定</button></div></div>';
    document.body.appendChild(mConfirm);
    mConfirm.addEventListener('click', function(e){ if(e.target===mConfirm){ mConfirm.classList.remove('show'); cfCb=null; } });
  }
  document.getElementById('cmsg').textContent=msg;
  cfCb=f;
  mConfirm.classList.add('show');
  document.getElementById('cyes').onclick=function(){ mConfirm.classList.remove('show'); var g=cfCb; cfCb=null; if(g)g(); };
  document.getElementById('cno').onclick=function(){ mConfirm.classList.remove('show'); cfCb=null; };
}

/* ------------------------------ 返回键 / 快捷键 ------------------------------ */
window.ywBack=function(){
  if($('#mPrompt').classList.contains('show')) return $('#ppNo').click();
  if(mConfirm&&mConfirm.classList.contains('show')) return $('#cno').click();
  if($('#mBak').classList.contains('show')) return $('#mBak').classList.remove('show');
  if($('#mDone').classList.contains('show')) return $('#doneOk').click();
  if($('#hist').classList.contains('show')) return $('#hClose').click();
  if(R) return exitRun();
  if(N&&N.toast){ try{ N.toast('再按一次返回键退出应用'); }catch(e){} }
  return true;
};
document.addEventListener('keydown',function(e){
  if(!R) return;
  if(e.key==='ArrowLeft') prev();
  else if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); next(); }
  else if(e.key==='Escape') $('#btnQuit').click();
});

/* ------------------------------ 横屏守卫 ------------------------------ */
function orient(){ $('#vp').style.display = (window.innerHeight>window.innerWidth)?'block':'none'; }
window.addEventListener('resize',orient);
window.addEventListener('orientationchange',function(){ setTimeout(orient,150); });

/* ------------------------------ 启动 ------------------------------ */
boot();
renderAll();
orient();
netCheck();
setInterval(netCheck,50000);
</script>
