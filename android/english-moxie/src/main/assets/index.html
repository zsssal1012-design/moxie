<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语默写</title>
<style>
:root{
  --blue:#2563eb;--blue2:#1d4ed8;--ink:#1f2937;--ink2:#64748b;
  --grad:linear-gradient(135deg,#3b82f6,#1d4ed8);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",sans-serif;color:var(--ink);
  background:linear-gradient(130deg,#e3f0ff 0%,#dbeafe 40%,#e0f2fe 72%,#d6ecff 100%)}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none}
body::before{width:46vw;height:46vw;left:-10vw;top:-18vh;background:#93c5fd}
body::after{width:42vw;height:42vw;right:-8vw;bottom:-16vh;background:#7dd3fc}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:8px 12px 10px;gap:10px}

.glass{background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.65);box-shadow:0 12px 32px rgba(30,64,175,.12);border-radius:20px}
.glass-inner{background:rgba(255,255,255,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);border-radius:14px}

/* ===== 顶栏(默写时隐藏) ===== */
.topbar{display:flex;align-items:center;gap:12px;padding:6px 14px;border-radius:20px;flex:none}
.brand{font-size:17.5px;font-weight:800;white-space:nowrap}
.seg{display:flex;background:rgba(255,255,255,.45);border-radius:999px;padding:3px;border:1px solid rgba(255,255,255,.7)}
.seg button{border:none;background:transparent;padding:6px 15px;border-radius:999px;font-size:13px;font-weight:700;color:#475569;transition:all .2s}
.seg button.active{background:#fff;color:var(--blue2);box-shadow:0 4px 14px rgba(30,64,175,.18)}
.spacer{flex:1}
.record-btn{border:none;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(59,130,246,.35)}
.record-btn:active{transform:translateY(2px)}

/* ===== 主区域 ===== */
main{flex:1;min-height:0;display:flex}
.page{flex:1;min-width:0;display:flex;gap:12px;overflow-y:auto}
.hidden{display:none!important}
.split-l{width:46%;min-width:0;display:flex;flex-direction:column;padding:14px}
.split-r{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.hint-card{padding:24px 36px;text-align:center;color:#7c8aa5;font-size:14.5px;font-weight:600;border-radius:20px;background:rgba(255,255,255,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.6)}
.hint-card .big{font-size:36px;display:block;margin-bottom:10px}

/* ===== 单词准备页 ===== */
.panel-title{font-size:15px;font-weight:800;margin-bottom:9px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
select{appearance:none;-webkit-appearance:none;border:none;outline:none;background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);border-radius:11px;padding:6px 26px 6px 10px;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%233b82f6' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 9px center;box-shadow:0 3px 10px rgba(30,64,175,.08)}
.mini-btn{border:none;border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;color:#475569;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85)}
.mini-btn:active{transform:scale(.96)}
.unit-list{flex:1;min-height:0;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:8px}
.unit-list::-webkit-scrollbar{width:5px}
.unit-list::-webkit-scrollbar-thumb{background:rgba(59,130,246,.35);border-radius:99px}
.unit-card{padding:9px 12px}
.unit-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.unit-head input[type=checkbox]{width:19px;height:19px;accent-color:#3b82f6;flex:none}
.unit-name{font-size:13.5px;font-weight:800;flex:1}
.unit-count{font-size:11px;font-weight:700;color:var(--blue);background:rgba(59,130,246,.14);padding:2px 9px;border-radius:99px}
.tri{font-size:12px;color:#94a3b8;transition:transform .25s}
.tri.open{transform:rotate(90deg);color:var(--blue)}
.unit-words{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed rgba(148,163,184,.4)}
.unit-words.open{display:block}
.words-wrap{display:flex;flex-wrap:wrap;gap:7px}
.wchip{padding:6px 11px;border-radius:11px;font-size:12px;font-weight:600;color:#334155;cursor:pointer;transition:all .16s;background:rgba(255,255,255,.85);border:1.5px solid rgba(226,232,240,.9)}
.wchip:active{transform:scale(.93)}
.wchip.sel{background:linear-gradient(135deg,rgba(147,197,253,.55),rgba(191,219,254,.45));backdrop-filter:blur(10px);border-color:rgba(59,130,246,.8);color:var(--blue2);box-shadow:0 0 0 1px rgba(59,130,246,.35) inset,0 5px 14px rgba(59,130,246,.22);transform:scale(1.04)}
.wchip .st{font-size:10px;color:#94a3b8}
.wchip.sel .st{color:var(--blue)}
.selall-row{display:flex;justify-content:flex-end;margin-bottom:7px}
.selall-btn{border:none;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#38bdf8,#0284c7);box-shadow:0 4px 12px rgba(56,189,248,.3)}
.locked-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;gap:8px}
.bottom-bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:7px 12px;border-radius:16px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.sel-info{font-size:12.5px;font-weight:700;color:#475569}
.start-btn{border:none;border-radius:999px;padding:9px 20px;font-size:13.5px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(59,130,246,.4)}
.start-btn:disabled{opacity:.45;box-shadow:none}
.start-btn:not(:disabled):active{transform:translateY(2px)}

/* ===== 短语准备页 ===== */
.phrase-panel{width:58%;flex-direction:column;padding:12px 14px;gap:8px}
.phrase-top{display:flex;gap:8px;align-items:center;flex:none}
.save-btn{margin-left:auto;border:none;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(59,130,246,.35)}
.save-btn:active{transform:translateY(2px)}
.danger-ghost{border:none;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:700;color:#e11d48;background:rgba(225,29,72,.08);border:1px solid rgba(225,29,72,.25)}
.section-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.section-list::-webkit-scrollbar{width:5px}
.section-list::-webkit-scrollbar-thumb{background:rgba(59,130,246,.35);border-radius:99px}
.ph-sec{padding:9px 12px}
.ph-sec-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.ph-sec-title{font-size:13.5px;font-weight:800;flex:1}
.ph-sec-cnt{font-size:11px;font-weight:700;color:var(--blue);background:rgba(59,130,246,.14);padding:2px 8px;border-radius:99px}
.ph-input-row{display:flex;gap:7px;margin-bottom:7px}
.ph-input-row textarea{flex:1;resize:none;outline:none;border-radius:10px;padding:7px 10px;font-size:12px;font-family:inherit;background:rgba(255,255,255,.8);border:1px solid rgba(226,232,240,.9);color:var(--ink);min-height:46px}
.ph-input-row textarea:focus{border-color:rgba(59,130,246,.6)}
.tr-btn{border:none;border-radius:10px;padding:0 11px;font-size:11.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#38bdf8,#0284c7);box-shadow:0 4px 12px rgba(56,189,248,.3);flex:none}
.tr-btn:disabled{opacity:.5}
.ph-items{display:flex;flex-direction:column;gap:6px}
.ph-item{display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:11px;background:rgba(255,255,255,.55);border:1px solid rgba(241,245,249,.9)}
.ph-item.checked{background:linear-gradient(135deg,rgba(147,197,253,.4),rgba(191,219,254,.3));border-color:rgba(59,130,246,.6)}
.ph-item input[type=checkbox]{width:17px;height:17px;accent-color:#3b82f6;flex:none}
.ph-en{font-size:12px;font-weight:700;color:#1e293b;flex:1;word-break:break-word}
.ph-cn{font-size:11px;color:#94a3b8;max-width:38%;text-align:right;word-break:break-word}
.ph-del{border:none;background:transparent;color:#cbd5e1;font-size:13px}
.ph-del:active{color:#e11d48}
.ph-empty{font-size:12px;color:#a5b0c2;padding:4px 2px}

/* ===== 默写页(全新: 无顶栏/无按钮/大卡片) ===== */
#pageQuiz{flex-direction:column;gap:10px;overflow:hidden}
.quiz-top{flex:none;display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:18px}
.quiz-exit{border:none;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.65);color:#64748b;font-size:14px;font-weight:800;flex:none}
.quiz-prog{font-size:14px;font-weight:800;color:#475569;white-space:nowrap}
.prog-track{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.6);overflow:hidden;border:1px solid rgba(255,255,255,.7)}
.prog-fill{height:100%;border-radius:99px;background:var(--grad);transition:width .3s ease}
.quiz-type-badge{font-size:11px;font-weight:800;color:var(--blue);background:rgba(59,130,246,.14);padding:4px 12px;border-radius:99px}
.quiz-body{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.quiz-card{width:88%;max-width:960px;padding:52px 40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px;cursor:pointer;user-select:none}
.quiz-card:active{transform:scale(.985)}
.q-text{font-size:54px;font-weight:900;color:#111826;line-height:1.3;word-break:break-word;max-height:36vh;overflow-y:auto}
.q-text.small{font-size:36px}
.q-ans{display:none;padding:14px 32px;border-radius:16px;background:linear-gradient(135deg,rgba(147,197,253,.45),rgba(191,219,254,.35));border:1.5px solid rgba(59,130,246,.55);font-size:34px;font-weight:800;color:var(--blue2);word-break:break-word;max-width:95%}
.q-ans.show{display:block;animation:fadeSlide .25s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tap-hint{position:absolute;bottom:14px;font-size:12.5px;font-weight:800;color:rgba(37,99,235,.45);pointer-events:none;user-select:none}
.tap-l{left:26px}.tap-r{right:26px}

/* ===== 结果页 ===== */
#pageResult{flex-direction:column;align-items:center;gap:12px}
.result-card{width:84%;max-width:840px;flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 24px;gap:12px}
.result-title{text-align:center;font-size:19px;font-weight:900}
.result-sub{text-align:center;font-size:12px;color:#7c8aa5;font-weight:700}
.result-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.result-list::-webkit-scrollbar{width:5px}
.result-list::-webkit-scrollbar-thumb{background:rgba(59,130,246,.35);border-radius:99px}
.result-chip{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:11px;font-size:13px;font-weight:800;color:var(--blue2);background:linear-gradient(135deg,rgba(147,197,253,.45),rgba(191,219,254,.35));border:1px solid rgba(59,130,246,.55)}
.result-chip .no{font-size:11px;color:#60a5fa;font-weight:800}
.result-btns{display:flex;gap:12px;justify-content:center}
.qbtn{border:none;border-radius:999px;padding:10px 24px;font-size:13.5px;font-weight:800;color:#fff;background:var(--grad);box-shadow:0 8px 20px rgba(59,130,246,.25)}
.qbtn.gray{background:linear-gradient(135deg,#94a3b8,#64748b)}

/* ===== 记录页 ===== */
#pageRecord{flex-direction:column;gap:10px}
.rec-top{flex:none;display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:18px}
.back-btn{border:none;border-radius:11px;padding:7px 14px;font-size:12.5px;font-weight:800;color:#475569;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.9)}
.rec-title{font-size:16px;font-weight:900;flex:1}
.clear-rec{border:none;border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;color:#e11d48;background:rgba(225,29,72,.08);border:1px solid rgba(225,29,72,.25)}
.filter-row{flex:none;display:flex;gap:10px;align-items:center;padding:6px 12px;border-radius:15px;flex-wrap:wrap}
.f-label{font-size:11px;font-weight:800;color:#7c8aa5}
.chip{border:none;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;color:#475569;background:rgba(255,255,255,.6);border:1px solid rgba(226,232,240,.9)}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.35)}
.record-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.record-list::-webkit-scrollbar{width:5px}
.record-list::-webkit-scrollbar-thumb{background:rgba(59,130,246,.35);border-radius:99px}
.date-group{font-size:11px;font-weight:900;color:#7c8aa5;padding:5px 4px 0;letter-spacing:1px}
.rec{padding:9px 13px}
.rec-head{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.rec-time{font-size:12px;font-weight:800;color:#334155;white-space:nowrap}
.badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge.word{color:var(--blue2);background:rgba(59,130,246,.14)}
.badge.phrase{color:#0e7490;background:rgba(14,116,144,.12)}
.rec-scope{font-size:12px;font-weight:700;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-cnt{font-size:11px;font-weight:800;color:var(--blue);background:rgba(59,130,246,.12);padding:2px 9px;border-radius:99px;white-space:nowrap}
.rec .tri{font-size:13px}
.rec-body{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(148,163,184,.4)}
.rec-body.open{display:block}
.rec-item{display:flex;align-items:baseline;gap:8px;padding:5px 2px;border-bottom:1px solid rgba(241,245,249,.9);font-size:12.5px}
.rec-item:last-child{border-bottom:none}
.rec-item .no{font-size:11px;color:#94a3b8;font-weight:800;width:22px;flex:none}
.rec-item .en{font-weight:800;color:#1e293b}
.rec-item .cn{font-size:11px;color:#94a3b8;margin-left:auto;text-align:right}
.empty-tip{text-align:center;color:#94a3b8;font-weight:700;padding:40px 0}

#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,.82);backdrop-filter:blur(10px);color:#fff;font-size:13px;font-weight:700;padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <header class="topbar glass" id="topbar">
    <div class="brand">📖 英语默写</div>
    <div class="seg">
      <button id="tabWord" class="active">abc 单词</button>
      <button id="tabPhrase">✏️ 短语</button>
    </div>
    <div class="spacer"></div>
    <button class="record-btn" id="btnRecord">📊 默写记录</button>
  </header>

  <main>
    <!-- 单词准备页 -->
    <section class="page" id="pageWord">
      <div class="split-l glass">
        <div class="panel-title">📚 选择词库</div>
        <div class="row">
          <select id="gradeSelWord"></select>
          <button class="mini-btn" id="expandAllBtn">全部展开</button>
          <button class="mini-btn" id="clearSelBtn">清空已选</button>
        </div>
        <div class="unit-list" id="unitList"></div>
        <div class="bottom-bar">
          <span class="sel-info" id="selCount">已选 0 个单词</span>
          <button class="start-btn" id="startWordBtn" disabled>▶ 开始默写</button>
        </div>
      </div>
      <div class="split-r">
        <div class="hint-card"><span class="big">📚</span>在左侧勾选单词后<br>点击「开始默写」</div>
      </div>
    </section>

    <!-- 短语准备页 -->
    <section class="page hidden" id="pagePhrase">
      <div class="split-r" style="width:42%;flex:none">
        <div class="hint-card"><span class="big">📝</span>在右侧输入或勾选短语<br>然后点击「开始默写」</div>
      </div>
      <div class="split-l glass phrase-panel" style="width:58%">
        <div class="phrase-top">
          <select id="gradeSelPhrase"></select>
          <select id="unitSelPhrase"></select>
          <button class="save-btn" id="savePhraseBtn">💾 保存题库</button>
        </div>
        <div class="phrase-top">
          <button class="danger-ghost" id="delPhraseLibBtn">🗑 删除当前题库</button>
          <div class="spacer"></div>
          <span class="sel-info" id="phraseSelInfo">已选 0 条</span>
        </div>
        <div class="section-list" id="sectionList"></div>
        <div class="bottom-bar">
          <span class="sel-info" id="phraseCountInfo"></span>
          <button class="start-btn" id="startPhraseBtn" disabled>▶ 开始默写</button>
        </div>
      </div>
    </section>

    <!-- 默写页 -->
    <section class="page hidden" id="pageQuiz">
      <div class="quiz-top glass">
        <button class="quiz-exit" id="quizExit">✕</button>
        <span class="quiz-prog" id="quizProg">1 / 10</span>
        <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
        <span class="quiz-type-badge" id="quizTypeBadge">单词默写</span>
      </div>
      <div class="quiz-body" id="quizBody">
        <div class="quiz-card glass" id="quizCard">
          <div class="q-text" id="qText">加载中...</div>
          <div class="q-ans" id="qAns"></div>
        </div>
        <div class="tap-hint tap-l">‹ 点左侧=上一题</div>
        <div class="tap-hint tap-r">点右侧=下一题 ›</div>
        <div class="tap-hint" style="left:50%;transform:translateX(-50%);bottom:4px;opacity:.7">点卡片看答案</div>
      </div>
    </section>

    <!-- 结果页 -->
    <section class="page hidden" id="pageResult">
      <div class="result-card glass">
        <div>
          <div class="result-title">🎉 本次默写完成</div>
          <div class="result-sub" id="resultSub"></div>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="result-btns">
          <button class="qbtn" id="resultBackBtn">返回默写页</button>
          <button class="qbtn gray" id="resultViewRecord">查看默写记录</button>
        </div>
      </div>
    </section>

    <!-- 记录页 -->
    <section class="page hidden" id="pageRecord">
      <div class="rec-top glass">
        <button class="back-btn" id="recBack">← 返回</button>
        <div class="rec-title">📊 默写记录</div>
        <button class="clear-rec" id="clearRecBtn">清空记录</button>
      </div>
      <div class="filter-row glass-inner">
        <span class="f-label">类型</span>
        <button class="chip active" data-tf="all">全部</button>
        <button class="chip" data-tf="word">单词</button>
        <button class="chip" data-tf="phrase">短语</button>
        <span class="f-label" style="margin-left:8px">单元</span>
        <span id="unitFilterBox" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      </div>
      <div class="record-list" id="recordList"></div>
    </section>

  </main>
</div>
<div id="toast"></div>

<script>
/* ================= 词库: 九年级上册全量(含词组, 第3位=1只要求认读) ================= */
const LIBS = {
  g7a:{name:"七年级上册",short:"七上",ready:false,units:[]},
  g7b:{name:"七年级下册",short:"七下",ready:false,units:[]},
  g8a:{name:"八年级上册",short:"八上",ready:false,units:[]},

const PHRASE_SECTIONS=["Welcome","Reading","Grammar","Integration"];
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
};
let currentWordLib="g9a",currentPhraseLib="g9a",currentPhraseUnit="U1";

function esc(s){var A=String.fromCharCode(38),Q=String.fromCharCode(34);return String(s).split(A).join(A+"amp;").split("<").join(A+"lt;").split(">").join(A+"gt;").split(Q).join(A+"quot;");}
function shuffle(a){const c=a.slice();for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),1800);}
function fmtTime(ts){const d=new Date(ts),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function quizPageOf(t){return t==="phrase"?"pagePhrase":"pageWord";}
/* 核心: 默写页隐藏整个顶栏, 其余页显示 */
function pages(name){
  ["pageWord","pagePhrase","pageQuiz","pageResult","pageRecord"].forEach(id=>$("#"+id).classList.add("hidden"));
  $("#"+name).classList.remove("hidden");
  $("#topbar").style.display=(name==="pageQuiz")?"none":"flex";
}

/* ================= 顶栏 ================= */
$("#tabWord").onclick=()=>{$("#tabWord").classList.add("active");$("#tabPhrase").classList.remove("active");pages("pageWord");};
$("#tabPhrase").onclick=()=>{$("#tabPhrase").classList.add("active");$("#tabWord").classList.remove("active");pages("pagePhrase");};
$("#btnRecord").onclick=()=>{recFrom=$("#pagePhrase").classList.contains("hidden")?"pageWord":"pagePhrase";pages("pageRecord");recTypeFilter="all";recUnitFilter="all";renderRecordFilters();renderRecords();};

    const lib=LIBS[k];
    gs.insertAdjacentHTML("beforeend",'<option value="'+k+'">'+lib.name+(lib.ready?"":"（词库待导入）")+'</option>');
    gp.insertAdjacentHTML("beforeend",'<option value="'+k+'">'+lib.name+'</option>');
  });
  gs.value="g9a";gp.value="g9a";
  gs.onchange=()=>{currentWordLib=gs.value;selection.clear();expanded.clear();renderUnits();};
  gp.onchange=()=>{currentPhraseLib=gp.value;renderPhrase();};
}
function renderUnits(){
  const lib=LIBS[currentWordLib],box=$("#unitList");
  $("#startWordBtn").disabled=true;$("#selCount").textContent="已选 0 个单词";
  if(!lib.ready){box.innerHTML='<div class="locked-box"><span style="font-size:38px">🔒</span>该年级词库暂未导入</div>';return;}
  box.innerHTML="";
  lib.units.forEach((unit,ui)=>{
    const card=document.createElement("div");
    card.className="unit-card glass-inner";
    card.innerHTML='<div class="unit-head"><input type="checkbox" class="u-check"><span class="unit-name">'+unit.name+'</span><span class="unit-count">'+unit.w.length+'词</span><span class="tri">▶</span></div><div class="unit-words"><div class="selall-row"><button class="selall-btn">全选本单元</button></div><div class="words-wrap"></div></div>';
    box.appendChild(card);
    const words=card.querySelector(".unit-words"),tri=card.querySelector(".tri"),check=card.querySelector(".u-check");
    card.querySelector(".unit-head").onclick=function(e){
      if(e.target===check)return;
      const open=words.classList.toggle("open");tri.classList.toggle("open",open);
    };
    check.onchange=function(){
      unit.w.forEach((w,wi)=>{const k=ui+"-"+wi;this.checked?selection.add(k):selection.delete(k);});
      syncChips(card,ui,unit);updateSelInfo();
    };
    card.querySelector(".selall-btn").onclick=function(e){
      e.stopPropagation();
      const all=unit.w.every((w,wi)=>selection.has(ui+"-"+wi));
      unit.w.forEach((w,wi)=>{const k=ui+"-"+wi;all?selection.delete(k):selection.add(k);});
      check.checked=!all;syncChips(card,ui,unit);updateSelInfo();
    };
    const wrap=card.querySelector(".words-wrap");
    unit.w.forEach((w,wi)=>{
      const chip=document.createElement("span");
      chip.className="wchip"+(selection.has(ui+"-"+wi)?" sel":"");
      chip.innerHTML=esc(w[0])+(w[2]?'<span class="st">*</span>':"");
      chip.onclick=()=>{const k=ui+"-"+wi;selection.has(k)?selection.delete(k):selection.add(k);chip.classList.toggle("sel");updateSelInfo();};
      wrap.appendChild(chip);
    });
    if(expanded.has(ui)){words.classList.add("open");tri.classList.add("open");}
  });
}
function syncChips(card,ui,unit){
  card.querySelectorAll(".wchip").forEach((chip,wi)=>chip.classList.toggle("sel",selection.has(ui+"-"+wi)));
}
function updateSelInfo(){
  $("#selCount").textContent="已选 "+selection.size+" 个单词";
  $("#startWordBtn").disabled=selection.size===0;
  const lib=LIBS[currentWordLib];
  if(lib.ready)lib.units.forEach((unit,ui)=>{
    const head=$("#unitList").children[ui];
    if(head)head.querySelector(".u-check").checked=unit.w.every((w,wi)=>selection.has(ui+"-"+wi));
  });
}
$("#expandAllBtn").onclick=()=>{
  const lib=LIBS[currentWordLib];if(!lib.ready)return;
  if(expanded.size===lib.units.length)expanded.clear();else lib.units.forEach((u,i)=>expanded.add(i));
  renderUnits();
};
$("#clearSelBtn").onclick=()=>{selection.clear();renderUnits();};
$("#startWordBtn").onclick=()=>{
  const lib=LIBS[currentWordLib],items=[],unitsHit=new Set();
  selection.forEach(k=>{const[ui,wi]=k.split("-").map(Number);items.push({en:lib.units[ui].w[wi][0],cn:lib.units[ui].w[wi][1]});unitsHit.add(lib.units[ui].id);});
  if(!items.length)return;
  quiz={type:"word",items:shuffle(items),idx:0,scope:lib.short+" · "+Array.from(unitsHit).join(" + "),units:Array.from(unitsHit)};
  startQuiz();
};

/* ================= 短语模块 ================= */
function phKey(){return currentPhraseLib+"|"+currentPhraseUnit;}
function getPhData(){if(!phraseLibs[phKey()])phraseLibs[phKey()]={};PHRASE_SECTIONS.forEach(s=>{if(!phraseLibs[phKey()][s])phraseLibs[phKey()][s]=[];});return phraseLibs[phKey()];}
function savePhraseLibs(){store.set("phraseLibs_v3",phraseLibs);}
function renderPhrase(){
  const us=$("#unitSelPhrase");
  us.innerHTML="";
  for(let i=1;i<=8;i++)us.insertAdjacentHTML("beforeend",'<option value="U'+i+'">Unit '+i+'</option>');
  us.value=currentPhraseUnit;
  us.onchange=()=>{currentPhraseUnit=us.value;renderSections();};
  renderSections();
}
function renderSections(){
  const box=$("#sectionList");box.innerHTML="";
  const data=getPhData();let total=0;
  PHRASE_SECTIONS.forEach((sec,si)=>{
    const arr=data[sec]||[];total+=arr.length;
    const card=document.createElement("div");
    card.className="ph-sec glass-inner";
    card.innerHTML='<div class="ph-sec-head"><span class="ph-sec-title">📄 '+sec+'</span><span class="ph-sec-cnt">'+arr.length+'条</span><button class="mini-btn" data-sa>全选</button></div><div class="ph-input-row"><textarea placeholder="输入英文短语/句子，每行一个">'+(data[sec+"_input"]?esc(data[sec+"_input"]):"")+'</textarea><button class="tr-btn">翻译并添加</button></div><div class="ph-items"></div>';
    box.appendChild(card);
    const ta=card.querySelector("textarea");
    ta.oninput=()=>{data[sec+"_input"]=ta.value;savePhraseLibs();};
    card.querySelector(".tr-btn").onclick=function(){translateAdd(si,this);};
    card.querySelector("[data-sa]").onclick=()=>{
      const all=arr.length&&arr.every(it=>it.sel);
      arr.forEach(it=>it.sel=!all);savePhraseLibs();renderSections();
    };
    const itemsBox=card.querySelector(".ph-items");
    if(!arr.length)itemsBox.innerHTML='<div class="ph-empty">暂无短语，输入后点击「翻译并添加」</div>';
    arr.forEach((it,ii)=>{
      const row=document.createElement("div");
      row.className="ph-item"+(it.sel?" checked":"");
      row.innerHTML='<input type="checkbox" '+(it.sel?"checked":"")+'><span class="ph-en">'+esc(it.en)+'</span><span class="ph-cn">'+esc(it.cn||"")+'</span><button class="ph-del">✕</button>';
      row.querySelector("input").onchange=function(){it.sel=this.checked;row.classList.toggle("checked",it.sel);updatePhraseInfo();};
      row.querySelector(".ph-del").onclick=()=>{arr.splice(ii,1);savePhraseLibs();renderSections();toast("已删除");};
      itemsBox.appendChild(row);
    });
  });
  $("#phraseCountInfo").textContent="共 "+total+" 条短语";
  updatePhraseInfo();
}
async function translateAdd(si,btn){
  const card=btn.closest(".ph-sec"),ta=card.querySelector("textarea");
  const text=ta.value.trim();
  if(!text){toast("请先输入英文短语");return;}
  const data=getPhData(),arr=data[PHRASE_SECTIONS[si]];
  const lines=text.split("\n").map(s=>s.trim()).filter(Boolean);
  const fresh=lines.filter(l=>!arr.some(it=>it.en.toLowerCase()===l.toLowerCase()));
  if(!fresh.length){toast("这些短语已存在");return;}
  btn.disabled=true;const old=btn.textContent;btn.textContent="翻译中...";
  let ok=0,fail=0;
  for(const line of fresh){
    let cn="";
    try{
      const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(line)+"&langpair=en|zh-CN");
      const j=await r.json();
      const t=(j&&j.responseData&&j.responseData.translatedText)||"";
      if(t&&!/MYMEMORY WARNING|QUERY LENGTH|INVALID/i.test(t))cn=t;else fail++;
    }catch(e){fail++;}
    arr.push({en:line,cn:cn||"（未获取到翻译）",sel:true});if(cn)ok++;
  }
  btn.disabled=false;btn.textContent=old;
  data[PHRASE_SECTIONS[si]+"_input"]="";
  savePhraseLibs();renderSections();
  toast(fail?ok+" 条已添加，"+fail+" 条翻译失败":"已添加 "+ok+" 条并自动勾选");
}
$("#savePhraseBtn").onclick=()=>{
  const data=getPhData();let added=0;
  $$(".ph-input-row textarea").forEach((ta,i)=>{
    const text=ta.value.trim();if(!text)return;
    const arr=data[PHRASE_SECTIONS[i]];
    text.split("\n").map(s=>s.trim()).filter(Boolean).forEach(line=>{
      if(!arr.some(it=>it.en.toLowerCase()===line.toLowerCase())){arr.push({en:line,cn:"（未翻译）",sel:true});added++;}
    });
    data[PHRASE_SECTIONS[i]+"_input"]="";
  });
  savePhraseLibs();renderSections();
  toast(added?("已保存 "+added+" 条 ✓"):"没有新内容需要保存");
};
$("#delPhraseLibBtn").onclick=()=>{
  if(!confirm("确定删除 "+LIBS[currentPhraseLib].short+" "+currentPhraseUnit+" 的全部短语题库吗？"))return;
  delete phraseLibs[phKey()];savePhraseLibs();renderSections();toast("题库已删除");
};
function updatePhraseInfo(){
  const data=getPhData();let sel=0;
  PHRASE_SECTIONS.forEach(s=>(data[s]||[]).forEach(it=>{if(it.sel)sel++;}));
  $("#phraseSelInfo").textContent="已选 "+sel+" 条";
  $("#startPhraseBtn").disabled=sel===0;
}
$("#startPhraseBtn").onclick=()=>{
  const data=getPhData(),items=[],secs=[];
  PHRASE_SECTIONS.forEach(s=>{
    (data[s]||[]).forEach(it=>{if(it.sel)items.push({en:it.en,cn:it.cn});});
    if((data[s]||[]).some(it=>it.sel))secs.push(s);
  });
  if(!items.length)return;
  quiz={type:"phrase",items:shuffle(items),idx:0,scope:LIBS[currentPhraseLib].short+" · "+currentPhraseUnit.replace("U","Unit ")+" "+secs.join("+"),units:[currentPhraseUnit]};
  startQuiz();
};

/* ================= 默写流程 ================= */
function startQuiz(){$("#quizTypeBadge").textContent=quiz.type==="word"?"单词默写":"短语默写";pages("pageQuiz");renderQuiz();}
function renderQuiz(){
  const it=quiz.items[quiz.idx];
  $("#quizProg").textContent=(quiz.idx+1)+" / "+quiz.items.length;
  $("#progFill").style.width=((quiz.idx+1)/quiz.items.length*100)+"%";
  const q=$("#qText");
  q.textContent=it.cn;
  q.classList.toggle("small",it.cn.length>18);
  $("#qAns").textContent=it.en;
  $("#qAns").classList.remove("show");
}
function prevQ(){if(quiz.idx>0){quiz.idx--;renderQuiz();}else toast("已经是第一个了");}
function nextQ(){if(quiz.idx<quiz.items.length-1){quiz.idx++;renderQuiz();}else finishQuiz();}
/* 左半屏=上一题 右半屏=下一题 点卡片=答案 */
$("#quizBody").onclick=(e)=>{
  if(e.target.closest("#quizCard")){$("#qAns").classList.toggle("show");return;}
  (e.clientX<window.innerWidth/2)?prevQ():nextQ();
};
$("#quizExit").onclick=()=>{const t=quiz.type;quiz=null;toast("已退出本次默写（未保存）");pages(quizPageOf(t));};
function finishQuiz(){
  const recs=store.get("writeRecords_v3",[]);
  recs.unshift({id:Date.now(),ts:Date.now(),time:fmtTime(Date.now()),type:quiz.type,scope:quiz.scope,lib:quiz.type==="word"?currentWordLib:currentPhraseLib,units:quiz.units,count:quiz.items.length,items:quiz.items.map(it=>({en:it.en,cn:it.cn}))});
  store.set("writeRecords_v3",recs);
  $("#resultSub").textContent=quiz.scope+" · 共 "+quiz.items.length+" 个 · 已自动存入默写记录";
  const list=$("#resultList");list.innerHTML="";
  quiz.items.forEach((it,i)=>{list.insertAdjacentHTML("beforeend",'<span class="result-chip"><span class="no">'+(i+1)+'</span>'+esc(it.en)+'</span>');});
  pages("pageResult");
}
/* 结果页返回=回对应准备页 */
$("#resultBackBtn").onclick=()=>{const t=quiz.type;quiz=null;pages(quizPageOf(t));};
$("#resultViewRecord").onclick=()=>{recFrom=quizPageOf(quiz.type);recTypeFilter="all";recUnitFilter="all";renderRecordFilters();renderRecords();pages("pageRecord");};

/* ================= 默写记录 ================= */
function allRecords(){return store.get("writeRecords_v3",[]);}
function renderRecordFilters(){
  $$(".chip[data-tf]").forEach(c=>{
    c.classList.toggle("active",c.dataset.tf===recTypeFilter);
    c.onclick=()=>{recTypeFilter=c.dataset.tf;renderRecordFilters();renderRecords();};
  });
  const set=new Set();
  allRecords().forEach(r=>(r.units||[]).forEach(u=>set.add(u)));
  const box=$("#unitFilterBox");box.innerHTML="";
  const mk=(val,label)=>{
    const b=document.createElement("button");
    b.className="chip"+(recUnitFilter===val?" active":"");
    b.textContent=label;
    b.onclick=()=>{recUnitFilter=val;renderRecordFilters();renderRecords();};
    box.appendChild(b);
  };
  mk("all","全部");
  Array.from(set).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(u=>mk(u,u.replace("U","Unit ")));
}
function dateLabel(ts){
  const d=new Date(ts),now=new Date(),p=n=>String(n).padStart(2,"0");
  const ds=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  const ns=now.getFullYear()+"-"+p(now.getMonth()+1)+"-"+p(now.getDate());
  if(ds===ns)return"今天";
  const y=new Date(now.getTime()-86400000);
  const ys=y.getFullYear()+"-"+p(y.getMonth()+1)+"-"+p(y.getDate());
  if(ds===ys)return"昨天";
  return(d.getMonth()+1)+"月"+d.getDate()+"日"+(d.getFullYear()!==now.getFullYear()?d.getFullYear()+"年":"");
}
function renderRecords(){
  const box=$("#recordList");box.innerHTML="";
  let recs=allRecords();
  if(recTypeFilter!=="all")recs=recs.filter(r=>r.type===recTypeFilter);
  if(recUnitFilter!=="all")recs=recs.filter(r=>(r.units||[]).includes(recUnitFilter));
  if(!recs.length){box.innerHTML='<div class="empty-tip">暂无默写记录</div>';return;}
  let last="";
  recs.forEach(r=>{
    const label=dateLabel(r.ts);
    if(label!==last){box.insertAdjacentHTML("beforeend",'<div class="date-group">'+label+'</div>');last=label;}
    const card=document.createElement("div");
    card.className="rec glass-inner";
    card.innerHTML='<div class="rec-head"><span class="rec-time">'+esc(r.time)+'</span><span class="badge '+(r.type==="word"?"word":"phrase")+'">'+(r.type==="word"?"单词":"短语")+'</span><span class="rec-scope">'+esc(r.scope)+'</span><span class="rec-cnt">'+r.count+'个</span><span class="tri">▶</span></div><div class="rec-body">'+r.items.map((it,i)=>'<div class="rec-item"><span class="no">'+(i+1)+'</span><span class="en">'+esc(it.en)+'</span><span class="cn">'+esc(it.cn)+'</span></div>').join("")+'</div>';
    card.querySelector(".rec-head").onclick=function(){
      const body=card.querySelector(".rec-body"),tri=card.querySelector(".tri");
      const open=body.classList.toggle("open");
      tri.classList.toggle("open",open);
    };
    box.appendChild(card);
  });
}
$("#recBack").onclick=()=>pages(recFrom);
$("#clearRecBtn").onclick=()=>{
  if(!confirm("确定清空全部默写记录吗？此操作不可恢复。"))return;
  store.set("writeRecords_v3",[]);renderRecords();toast("记录已清空");
};

/* ================= 启动 ================= */
initGradeSelects();
renderUnits();
renderPhrase();
</script>
</body>
</html>
